<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - Escala Litúrgica</title>
    <link rel="icon" type="image/jpeg" href="logo/logo_coroinhas.jpeg">
    <link rel="stylesheet" href="style.css">
    <style>
        body.login-page {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: var(--color-bg);
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .login-card {
            background: white;
            padding: 40px 30px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-card h1 {
            color: var(--color-wine);
            margin-bottom: 10px;
            font-size: 1.5rem;
            font-weight: 700;
        }
        .login-card p {
            color: #6B7280;
            margin-bottom: 25px;
            font-size: 0.95rem;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--color-text);
            font-size: 0.95rem;
        }
        .form-group input {
            width: 100%;
            min-height: 44px; /* UI/UX para Toque */
            padding: 10px 15px;
            border: 2px solid var(--color-border);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: all 0.2s;
            font-family: inherit;
            box-sizing: border-box;
        }
        .form-group input:focus {
            border-color: var(--color-wine);
            box-shadow: 0 0 0 3px rgba(114, 47, 55, 0.1);
        }
        .btn-login {
            width: 100%;
            min-height: 44px; /* UI/UX para Toque */
            background-color: var(--color-wine);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-login:hover {
            background-color: #5a252c;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(114, 47, 55, 0.2);
        }
        .btn-login:active {
            transform: translateY(0);
        }
        .error-message {
            color: #E11D48;
            margin-top: 15px;
            font-size: 0.9rem;
            display: none;
            font-weight: 500;
        }
    </style>
</head>
<body class="login-page">
    <div class="login-card">
        <h1>Sistema Privado</h1>
        <p>Escala Litúrgica - Acesso Restrito</p>
        
        <form id="login-form">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="Digite seu e-mail" required>
            </div>
            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" placeholder="Digite sua senha" required>
            </div>
            <button type="submit" class="btn-login">Entrar no Sistema</button>
            <div id="login-error" class="error-message">E-mail ou senha incorretos.</div>
        </form>
    </div>

    <!-- Importe o Supabase via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Script principal com a lógica do app e do Supabase -->
    <script src="script.js" defer></script>
</body>
</html>
